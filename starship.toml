"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'nord'
scan_timeout = 30
command_timeout = 500
follow_symlinks = true
continuation_prompt = "[∙](bright-black) "

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

[character]
format = "$symbol "
success_symbol = "[➜](bold fg:green)"
error_symbol = "[➜](bold fg:red)"
vimcmd_symbol = "[⬅](bold fg:yellow)"
vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
vimcmd_replace_symbol = "[❮](bold fg:purple)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"
disabled = false

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
read_only = '🔒'
read_only_style = 'red'
home_symbol = '~'
use_os_path_sep = true
use_logical_path = true
fish_style_pwd_dir_length = 0
disabled = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch(:$remote_branch) ]($style)'
truncation_length = 9223372036854775807
truncation_symbol = '…'
only_attached = false
always_show_remote = false
ignore_branches = []
ignore_bare_repo = false
disabled = false

[git_status]
style = 'fg:yellow'
format = '([$all_status$ahead_behind]($style) )'
stashed = '\$'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
conflicted = '='
untracked = '?'
modified = '!'
staged = '+'
deleted = '✘'
renamed = '»'
typechanged = ''
worktree_added = ''
worktree_deleted = ''
worktree_modified = ''
worktree_typechanged = ''
index_added = ''
index_deleted = ''
index_modified = ''
index_typechanged = ''
ignore_submodules = false
use_git_executable = false
disabled = false

[fill]
symbol = ' '
style = 'bold black'
disabled = false

[line_break]
disabled = false

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
version_format = 'v${raw}'
pyenv_version_name = true
pyenv_prefix = ''
disabled = false
detect_extensions = ['py', 'pyi', 'pyw', 'ipynb']
detect_files = ['requirements.txt', '.python-version', 'pyproject.toml', 'Pipfile', 'tox.ini', 'setup.py', '__init__.py']
detect_folders = []
detect_env_vars = ['VIRTUAL_ENV']
generic_venv_names = []

[lua]
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
style = 'bold blue'
disabled = false

[nodejs]
style = 'blue'
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
disabled = false

[golang]
style = 'blue'
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
disabled = false

[haskell]
style = 'blue'
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
disabled = false

[rust]
style = 'orange'
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
disabled = false

[ruby]
style = 'blue'
symbol = ' '
format = 'via [$symbol($version )]($style)'
version_format = 'v${raw}'
disabled = false

[package]
symbol = '󰏗 '
format = 'is [$symbol$version]($style) '
version_format = 'v${raw}'
style = '208 bold'
disabled = false

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
expiration_symbol = 'X'
force_display = false
disabled = false

[aws.region_aliases]

[aws.profile_aliases]

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
only_with_files = true
detect_files = ['compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = []
detect_folders = []
disabled = false

[jobs]
symbol = ' '
style = 'red'
threshold = 1
symbol_threshold = 1
number_threshold = 1
format = '[$symbol$number]($style) '
disabled = false

[cmd_duration]
min_time = 500
show_milliseconds = true
style = 'fg:gray'
format = '[$duration]($style) '
show_notifications = false
min_time_to_notify = 45000
disabled = false

[status]
disabled = false
style = 'fg:red'
symbol = '✗ '
success_symbol = ''
format = '[$symbol$status]($style)'
map_symbol = true
pipestatus = true
pipestatus_separator = '|'
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style) '
recognize_signal_code = true

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white = '#D8DEE9'
